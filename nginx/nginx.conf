events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M;  # Allow large video uploads

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;  # Puedes cambiarlo por tu dominio

        # Uncomment for HTTPS
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Serve static video files from NFS/local storage
        location /storage/ {
            alias /var/www/storage/;
            add_header Cache-Control "public";
            expires 7d;
        }

 
        location /api/ {
            # Sin path extra en proxy_pass -> mantiene /api/... al backend
            proxy_pass http://anb-backend-alb-1926764760.us-east-1.elb.amazonaws.com;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for uploads
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Swagger documentation
        location /swagger/ {
            proxy_pass http://anb-backend-alb-1926764760.us-east-1.elb.amazonaws.com;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # SPA / aplicación frontend
        location / {
            # Ajusta la ruta si tu build se copia a otro directorio
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
